<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gym-Video</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#0f0f0f;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      overflow:hidden;
    }

    .container{
      width:100%;
      max-width:430px;
      padding:20px;
    }

    .video-card{
      position:relative;
      width:100%;
      aspect-ratio:4/5;
      border-radius:28px;
      overflow:hidden;
      cursor:pointer;
      background:#111;
      box-shadow:
        0 0 30px rgba(0,0,0,0.5),
        0 20px 50px rgba(0,0,0,0.7);
      transition:0.3s ease;
    }

    .video-card:hover{
      transform:scale(1.02);
    }

    .thumbnail{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .overlay{
      position:absolute;
      inset:0;
      background:
        linear-gradient(
          to top,
          rgba(0,0,0,0.55),
          rgba(0,0,0,0.1)
        );
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .play-button{
      width:90px;
      height:90px;
      border-radius:50%;
      background:rgba(255,255,255,0.15);
      backdrop-filter:blur(10px);
      display:flex;
      justify-content:center;
      align-items:center;
      transition:0.3s ease;
      border:1px solid rgba(255,255,255,0.2);
    }

    .play-button:hover{
      transform:scale(1.08);
      background:rgba(255,255,255,0.22);
    }

    .triangle{
      width:0;
      height:0;
      border-left:28px solid white;
      border-top:18px solid transparent;
      border-bottom:18px solid transparent;
      margin-left:6px;
    }

    .pulse{
      position:absolute;
      width:90px;
      height:90px;
      border-radius:50%;
      border:2px solid rgba(255,255,255,0.35);
      animation:pulse 2s infinite;
    }

    @keyframes pulse{
      0%{
        transform:scale(1);
        opacity:1;
      }
      100%{
        transform:scale(1.7);
        opacity:0;
      }
    }

    .top-glow{
      position:absolute;
      top:-80px;
      left:-80px;
      width:180px;
      height:180px;
      background:rgba(255,255,255,0.08);
      filter:blur(80px);
      border-radius:50%;
    }

    .bottom-glow{
      position:absolute;
      bottom:-80px;
      right:-80px;
      width:180px;
      height:180px;
      background:rgba(255,255,255,0.06);
      filter:blur(80px);
      border-radius:50%;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="video-card" onclick="redirectAffiliate()">

      <div class="top-glow"></div>
      <div class="bottom-glow"></div>

      <!-- Ganti thumbnail.jpg dengan gambar kamu -->
      <img 
        src="https://i.imgur.com/dnDbI0a.png
        class="thumbnail"
        alt=""
      />

      <div class="overlay">

        <div class="pulse"></div>

        <div class="play-button">
          <div class="triangle"></div>
        </div>

      </div>

    </div>

  </div>

  <script>
    function redirectAffiliate(){
      window.location.href = "https://s.shopee.co.id/W3rIAYGa1";
    }
  </script>

</body>
</html>
